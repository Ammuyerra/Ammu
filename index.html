<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Card</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffe6f0;
    font-family: 'Poppins', sans-serif;
}

/* envelope */
.envelope {
    width: 360px;
    height: 250px;
    background: white;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

/* flap */
.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #f2f2f2;
    clip-path: polygon(0 0, 100% 0, 50% 60%);
    transform-origin: top;
    transition: transform 1s;
    z-index: 2;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

/* CARD CENTERED */
.card {
    width: 320px;
    height: 200px;
    background: linear-gradient(135deg, #ff4da6, #ff80bf);
    border-radius: 15px;
    position: absolute;
    
    top: 50%;
    left: 50%;
    
    transform: translate(-50%, 120%);
    transition: transform 1s ease;
    
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* slide out from center */
.envelope.open .card {
    transform: translate(-50%, -40%);
}

/* flip */
.inner {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 1s;
    transform-style: preserve-3d;
}

.card.flip .inner {
    transform: rotateY(180deg);
}

/* sides */
.front, .back {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 15px;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.front {
    color: white;
}

.back {
    background: white;
    color: #333;
    transform: rotateY(180deg);
    padding: 15px;
    text-align: center;
    font-size: 14px;
}

/* button */
button {
    margin-top: 10px;
    padding: 8px 16px;
    border: none;
    border-radius: 20px;
    background: white;
    color: #ff1a75;
    cursor: pointer;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="envelope" id="env">
    <div class="flap"></div>

    <div class="card" id="card">
        <div class="inner">

            <div class="front">
                <h3>🎂 Happy Birthday Siri 💖</h3>
                <button onclick="flipCard()">Open Card</button>
            </div>

            <div class="back">
                Hey Siri chelli  💖<br><br>

Nuvvu na life lo sweetest part 😊<br><br>

Ninnu chusina prathi sari  
na face lo automatic ga smile vastundi 💕<br><br>

Netho unna bond  
roju roju ki inka strong avuthundi 💖<br><br>

Happy Birthday chelli 🎂<br>
Stay happy forever ❤️
            </div>

        </div>
    </div>
</div>

<script>
window.onload = function() {
    setTimeout(() => {
        document.getElementById("env").classList.add("open");
    }, 500);
}

function flipCard() {
    document.getElementById("card").classList.add("flip");
}
</script>

</body>
</html>
